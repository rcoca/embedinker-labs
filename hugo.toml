baseURL = 'https://lab.embedinker.com/'
locale = 'en-us'
title = 'Embedinker Labs'
theme = 'PaperMod'
mainSections = ["posts"]

[params]
  ShowRssButtonInSectionTermList = true

  # Comments box (giscus / GitHub Discussions), rendered at the bottom of
  # single pages by layouts/partials/comments.html.
  # Category is chosen under the repo's Discussions settings; the categoryId
  # can be read off a widget generated at https://giscus.app.
  [params.comments]
  provider = "giscus"
  repo = "rcoca/embedinker-labs"
  repoId = "R_kgDOTGl32Q"
  category = "General"
  categoryId = "DIC_kwDOTGl32c4DJmNT"
  mapping = "pathname"
  strict = false
  reactions = true
  emitMetadata = false
  inputPosition = "bottom"
  theme = "preferred_color_scheme"
  lang = "en"

[privacy]
  [privacy.vimeo]
    disabled = false
  [privacy.youtube]
    disabled = false
    privacyEnhanced = true

[[menu.main]]
    name = "Labs"
    url = "/"
    weight = 5

